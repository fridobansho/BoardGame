<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="yellowChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  <!-- 2x2 grid representing Connect 4, Tic-Tac-Toe, Chomp pieces -->
  <circle cx="180" cy="180" r="54" fill="url(#redChip)"/>
  <circle cx="332" cy="180" r="54" fill="url(#yellowChip)"/>
  <!-- Tic-Tac-Toe cross -->
  <path d="M140 292 L220 372 M220 292 L140 372" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  <!-- Chomp bar icon -->
  <rect x="290" y="292" width="80" height="80" rx="16" fill="#f59e0b" stroke="#d97706" stroke-width="6"/>
</svg>
